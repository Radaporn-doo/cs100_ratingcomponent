<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <title>rating Component</title>
</head>

<body>
  <div class="container">
    <div class="card bg-light rounded-4 border-0 mt-5 shadow-lg">
      <div class="card-body">
        <div class="row p-5">
          <div class="col-7">
            <h2>What others think about the product</h2>
          </div>
          <div class="col-5">
            <div class="card">
              <div class="card body text-center m-3 border-0">
                <h3 class="display-5 fw-semibold"><i class="fa-solid fa-star text-warning"></i>4.8</h3>
                <p>Average Rating</p>
              </div>
            </div>
          </div>
        </div>
        <!--search reviews-->
        <div class="row">
          <div class="col-12">
            <div class="input-group input-group-lg">
              <span class="input-group-text rounded-start-5"><i class="fa-solid fa-magnifying-glass"></i></span>
              <input type="text" class="form-control rounded-end-5" placeholder="Search Reviews">
            </div>
          </div>
        </div>
        <!--Rating Distribution-->
        <div class="row p-5">
          <div class="col-12 v-stack gap-2">
            <h2>Ratings</h2>
            <!-- Rating Level 5 -->
            <div class="d-flex align-items-center gap-3">
              <span class="flex-shrink-0">
                5 <i class="fa-solid fa-star text-warning"></i>
              </span>
              <div class="progress flex-grow-1" style="height: 10px;">
                <div class="progress-bar bg-warning" role="progressbar" style="width: 80%;">
                </div>
              </div>
            </div>
            <!-- Rating Level 4 -->
            <div class="d-flex align-items-center gap-3">
              <span class="flex-shrink-0">
                4 <i class="fa-solid fa-star text-warning"></i> 
              </span>
              <div class="progress flex-grow-1" style="height: 10px;">
                <div class="progress-bar bg-warning" role="progressbar" style="width: 60%;">
                </div>
              </div>
            </div>
            <!-- Rating Level 3 -->
            <div class="d-flex align-items-center gap-3">
              <span class="flex-shrink-0">
                3 <i class="fa-solid fa-star text-warning"></i>
              </span>
              <div class="progress flex-grow-1" style="height: 10px;">
                <div class="progress-bar bg-warning" role="progressbar" style="width: 20%;">
                </div>
              </div>
            </div>
            <!-- Rating Level 2 -->
            <div class="d-flex align-items-center gap-3">
              <span class="flex-shrink-0">
                2 <i class="fa-solid fa-star text-warning"></i>
              </span>
              <div class="progress flex-grow-1" style="height: 10px;">
                <div class="progress-bar bg-warning" role="progressbar" style="width: 10%;">
                </div>
              </div>
            </div>
            <!-- Rating Level 1 -->
            <div class="d-flex align-items-center gap-3">
              <span class="flex-shrink-0">
                1 <i class="fa-solid fa-star text-warning"></i>
              </span>
              <div class="progress flex-grow-1" style="height: 10px;">
                <div class="progress-bar bg-warning" role="progressbar" style="width: 30%;">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
